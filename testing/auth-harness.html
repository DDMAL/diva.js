<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body, #diva-wrapper { height: 100%; margin: 0; }
      #diva-wrapper { display: flex; }
    </style>
  </head>
  <body>
    <div id="diva-wrapper"></div>
    <script>
      const harnessParams = new URLSearchParams(location.search);
      const osdPackage = harnessParams.get("osd") === "5"
        ? "openseadragon5"
        : "openseadragon";
      const divaBundle = harnessParams.get("bundle") === "production"
        ? "diva.js"
        : "diva.debug.js";
      document.write(`<script src="../node_modules/${osdPackage}/build/openseadragon/openseadragon.min.js"><\/script>`);
      document.write(`<script src="../build/${divaBundle}"><\/script>`);
    </script>
    <script>
      window.__divaOsdVersion = OpenSeadragon.version.versionStr;
      const initialPageParam = harnessParams.get("initialPage");
      window.diva = new Diva("diva-wrapper", {
        objectData: harnessParams.get("manifest"),
        initialPage: initialPageParam === null ? undefined : Number(initialPageParam),
        staticImageCorsPolicy: harnessParams.get("staticImageCorsPolicy") || undefined
      });
    </script>
  </body>
</html>
