<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      html, body, #diva-wrapper { height: 100%; margin: 0; }
      #diva-wrapper { display: flex; }
    </style>
  </head>
  <body>
    <div id="diva-wrapper"></div>
    <script>
      const osdPackage = new URLSearchParams(location.search).get("osd") === "5"
        ? "openseadragon5"
        : "openseadragon";
      document.write(`<script src="../node_modules/${osdPackage}/build/openseadragon/openseadragon.min.js"><\/script>`);
    </script>
    <script src="../build/diva.debug.js"></script>
    <script>
      window.__divaOsdVersion = OpenSeadragon.version.versionStr;
      window.diva = new Diva("diva-wrapper", {
        objectData: new URLSearchParams(location.search).get("manifest")
      });
    </script>
  </body>
</html>
