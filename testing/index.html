    <script>
      const searchParams = new URLSearchParams(window.location.search);

      // Supports both:
      //   #p=label:fol.%2069r
      //   #?p=label:fol.%2069r
      // and existing route-style hashes containing a query string.
      const hash = window.location.hash.slice(1);
      const hashQuery = hash.startsWith("?")
              ? hash.slice(1)
              : hash.includes("?")
                      ? hash.slice(hash.indexOf("?") + 1)
                      : hash;

      const hashParams = new URLSearchParams(hashQuery);

      function parsePageTarget(value) {
        if (value === null) {
          return undefined;
        }

        if (value.startsWith("canvas:")) {
          return {
            by: "canvasId",
            value: value.slice("canvas:".length)
          };
        }

        if (value.startsWith("label:")) {
          return {
            by: "label",
            value: value.slice("label:".length)
          };
        }

        if (value.startsWith("page:")) {
          const pageNumberText = value.slice("page:".length);

          // URL page numbers are one-based.
          if (/^[1-9]\d*$/.test(pageNumberText)) {
            return Number(pageNumberText) - 1;
          }
        }

        return undefined;
      }

      const manifestParam =
              searchParams.get("manifest") ||
              hashParams.get("manifest");

      const objectData = manifestParam?.trim() ||
              "https://iiif.bodleian.ox.ac.uk/iiif/manifest/c2ed1c10-4520-4b4f-b0e2-8ba6e0720890.json";

      const initialPage = parsePageTarget(hashParams.get("p"));

      window.diva = new Diva("diva-wrapper", {

          // objectData: "https://iiif.bodleian.ox.ac.uk/iiif/manifest/8c264b23-f6cc-4f18-98cf-9d75f7175b54.json",
